[project]
name = "cloud-cost-predictor"
version = "1.0.0"
description = "XGBoost quantile regression to quantify cloud infrastructure waste on 123K real VMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "streamlit>=1.28",
    "plotly>=5.15",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pyright",
    "httpx2",
]
notebooks = [
    "jupyter",
    "nbconvert",
    "ipykernel",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "shap>=0.42",
    "statsmodels>=0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".cache", ".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B905", "SIM115"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["notebooks", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=html:reports/coverage"
