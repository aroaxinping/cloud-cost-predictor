[project]
name = "cloud-cost-predictor"
version = "1.0.0"
description = "XGBoost quantile regression to quantify cloud infrastructure waste on 123K real VMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "streamlit>=1.28",
    "plotly>=5.15",
    "shap>=0.42",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
notebooks = [
    "jupyter",
    "nbconvert",
    "ipykernel",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B905", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
